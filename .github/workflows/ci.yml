name: CI

on:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Generates the gitignored expo-env.d.ts (Expo ambient module types, e.g.
      # `declare module '*.css'`) and .expo/types/router.d.ts (typed routes) that
      # `tsc` needs. `expo customize` runs the typegen without Metro and leaves
      # the committed tsconfig.json untouched.
      - name: Generate Expo types
        run: npx expo customize tsconfig.json

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test
