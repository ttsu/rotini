name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

  detect:
    name: Detect change type
    runs-on: ubuntu-latest
    outputs:
      needs_native_build: ${{ steps.detect.outputs.needs_native_build }}
      supabase_changed: ${{ steps.detect.outputs.supabase_changed }}
      build_limit_reached: ${{ steps.detect.outputs.build_limit_reached }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Detect fingerprint and Supabase changes
        id: detect
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PREV_SHA: ${{ github.event.before }}
          CURR_SHA: ${{ github.sha }}
          APP_ENV: preview
          EXPO_PUBLIC_SENTRY_ENVIRONMENT: preview
        run: |
          # Compute current fingerprint
          CURR_FP=$(npx @expo/fingerprint . | jq -r '.hash')
          echo "Current fingerprint: $CURR_FP"

          # Query last successful preview build from EAS and compare runtime versions.
          # With the fingerprint policy the runtime version IS the fingerprint hash, so a
          # match means an existing binary already covers this code — no rebuild needed.
          LAST_BUILD_JSON=$(eas build:list \
            --platform ios \
            --limit 10 \
            --json \
            --non-interactive 2>/dev/null || echo "[]")

          LAST_RUNTIME=$(echo "$LAST_BUILD_JSON" | jq -r \
            '[.[] | select(.buildProfile == "preview" and .status == "FINISHED" and .runtimeVersion != null)] | .[0].runtimeVersion // empty')

          echo "Last successful preview build runtime: ${LAST_RUNTIME:-none}"

          if [ -z "$LAST_RUNTIME" ] || [ "$CURR_FP" != "$LAST_RUNTIME" ]; then
            echo "needs_native_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Fingerprint matches last build — EAS Update only"
            echo "needs_native_build=false" >> "$GITHUB_OUTPUT"
          fi

          # Check EAS iOS build limit
          USAGE=$(eas account:usage --non-interactive 2>/dev/null || true)
          echo "$USAGE"
          IOS_LINE=$(echo "$USAGE" | grep -i 'ios' | head -1)
          IOS_USED=$(echo "$IOS_LINE" | grep -oE '[0-9]+' | sed -n '1p')
          IOS_LIMIT=$(echo "$IOS_LINE" | grep -oE '[0-9]+' | sed -n '2p')
          BUILD_LIMIT_REACHED=false
          if [ -n "$IOS_USED" ] && [ -n "$IOS_LIMIT" ] && [ "$IOS_LIMIT" -gt 0 ] && [ "$IOS_USED" -ge "$IOS_LIMIT" ]; then
            echo "EAS iOS build limit reached ($IOS_USED / $IOS_LIMIT) — skipping native build"
            BUILD_LIMIT_REACHED=true
          else
            echo "EAS iOS build limit not reached (${IOS_USED:-?} / ${IOS_LIMIT:-?})"
          fi
          echo "build_limit_reached=$BUILD_LIMIT_REACHED" >> "$GITHUB_OUTPUT"

          # Detect Supabase changes
          if [ "$PREV_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "supabase_changed=true" >> "$GITHUB_OUTPUT"
          elif git diff "$PREV_SHA" "$CURR_SHA" --name-only | grep -qE '^supabase/'; then
            echo "Supabase files changed"
            echo "supabase_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Supabase changes"
            echo "supabase_changed=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: EAS Build (iOS preview)
    needs: [quality, detect]
    if: needs.detect.outputs.needs_native_build == 'true' && needs.detect.outputs.build_limit_reached != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build for preview (iOS)
        run: eas build --profile preview --platform ios --non-interactive --wait

  deploy-supabase:
    name: Deploy Supabase
    needs: [quality, detect, build]
    if: |
      always() &&
      needs.quality.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      needs.detect.outputs.supabase_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Apply migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --password ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Deploy edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy

  deploy-update:
    name: EAS Update (preview)
    needs: [quality, detect, build, deploy-supabase]
    if: |
      always() &&
      needs.quality.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.deploy-supabase.result == 'success' || needs.deploy-supabase.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Publish EAS Update
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          # These mirror the values that app.config.js reads during EAS Build so
          # the fingerprint computed here matches the fingerprint computed on EAS.
          APP_ENV: preview
          EXPO_PUBLIC_SENTRY_ENVIRONMENT: preview
          GIT_COMMIT_SHA: ${{ github.sha }}
          EXPO_PUBLIC_SENTRY_DIST: ${{ github.sha }}
        run: |
          eas update \
            --branch preview \
            --message "Deploy: ${{ github.event.head_commit.message }}" \
            --non-interactive
