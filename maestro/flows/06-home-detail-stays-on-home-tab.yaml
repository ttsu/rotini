appId: com.timtsu.rotini
---
- runFlow: ../generated/login-owner.yaml
- assertVisible:
    id: 'home-your-shifts-section'
- tapOn:
    id: 'home-rota-card-e2e-kitchen-duty'
- extendedWaitUntil:
    visible:
      id: 'rota-detail-screen'
    timeout: 15000
- tapOn:
    id: 'tab-shifts'
- extendedWaitUntil:
    visible:
      id: 'shifts-screen'
    timeout: 15000
- tapOn:
    id: 'tab-home'
- extendedWaitUntil:
    visible:
      id: 'home-your-shifts-section'
    timeout: 15000
- assertNotVisible:
    id: 'rota-detail-screen'
