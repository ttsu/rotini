appId: com.gorotini.app
---
- runFlow: ../generated/login-owner.yaml
- assertVisible:
    id: 'home-today-section'
- tapOn:
    id: 'home-rota-card-e2e-kitchen-duty'
- extendedWaitUntil:
    visible:
      id: 'rota-detail-screen'
    timeout: 15000
- tapOn:
    text: 'Shifts'
- extendedWaitUntil:
    visible:
      id: 'shifts-screen'
    timeout: 15000
# Native tabs preserve each tab's stack on switch: returning to Home shows
# the detail where we left it (it stays on the Home tab, not Shifts)...
- tapOn:
    text: 'Home'
- extendedWaitUntil:
    visible:
      id: 'rota-detail-screen'
    timeout: 15000
# ...and re-tapping the active tab pops its stack to the root (iOS convention).
- tapOn:
    text: 'Home'
- extendedWaitUntil:
    visible:
      id: 'home-today-section'
    timeout: 15000
- assertNotVisible:
    id: 'rota-detail-screen'
