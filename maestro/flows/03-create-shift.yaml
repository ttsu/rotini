appId: com.gorotini.app
---
- runFlow: ../generated/login-owner.yaml
- tapOn:
    text: "Shifts"
- extendedWaitUntil:
    visible:
      id: "shifts-screen"
    timeout: 10000
- takeScreenshot: /private/tmp/claude-501/-Users-tim-projects-rotini/9e7df1f9-9923-4e7b-acad-626e11fdb6eb/scratchpad/screens/05-shifts-list
- tapOn:
    id: "create-new-shift-button"
- extendedWaitUntil:
    visible:
      id: "shift-name-input"
    timeout: 10000
- takeScreenshot: /private/tmp/claude-501/-Users-tim-projects-rotini/9e7df1f9-9923-4e7b-acad-626e11fdb6eb/scratchpad/screens/06-create-shift
- tapOn:
    id: "shift-name-input"
- inputText: "E2E Created Shift"
- tapOn:
    id: "shift-description-input"
- inputText: "Created by Maestro"
- tapOn:
    id: "edit-schedule-button"
# On Android the legacy @react-native-community/datetimepicker mounts as a
# dialog and auto-opens over the schedule modal (goes away when unit 42
# replaces it) — wait for it to animate in, then dismiss however many stack
# up; all no-ops on iOS.
- extendedWaitUntil:
    optional: true
    visible:
      text: "OK"
    timeout: 5000
- repeat:
    times: 4
    while:
      visible:
        text: "OK"
    commands:
      - tapOn:
          text: "OK"
          optional: true
- assertVisible:
    id: "schedule-modal"
- scrollUntilVisible:
    element:
      id: "rrule-frequency-tabs"
    direction: DOWN
- assertVisible:
    id: "rrule-frequency-tabs"
- takeScreenshot: /private/tmp/claude-501/-Users-tim-projects-rotini/9e7df1f9-9923-4e7b-acad-626e11fdb6eb/scratchpad/screens/07-schedule-modal
# iOS finds the header button by id; Android's accessibility bounds for the
# modal header are offset, so the id tap lands wrong there — the text tap
# works instead. Each is optional; whichever matches closes the modal.
- tapOn:
    id: "done-editing-schedule-button"
    optional: true
- tapOn:
    text: "Done"
    optional: true
- extendedWaitUntil:
    visible:
      id: "create-new-shift-button|shift-name-input|create-shift-button"
    timeout: 10000
    optional: true
- scrollUntilVisible:
    element:
      id: "create-shift-button"
    direction: DOWN
- tapOn:
    id: "create-shift-button"
- extendedWaitUntil:
    visible:
      id: "rota-detail-screen"
    timeout: 15000
- assertVisible:
    id: "rota-detail-duration-row"
- assertVisible:
    id: "rota-detail-assignment-row"
- scrollUntilVisible:
    element:
      id: "rota-members-section"
- assertVisible:
    id: "rota-members-section"
