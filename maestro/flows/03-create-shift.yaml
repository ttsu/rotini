appId: com.timtsu.rotini
---
- runFlow: ../generated/login-owner.yaml
- tapOn:
    id: "tab-shifts"
- extendedWaitUntil:
    visible:
      id: "shifts-screen"
    timeout: 10000
- tapOn:
    id: "create-new-shift-button"
- extendedWaitUntil:
    visible:
      id: "shift-name-input"
    timeout: 10000
- tapOn:
    id: "shift-name-input"
- inputText: "E2E Created Shift"
- tapOn:
    id: "shift-description-input"
- inputText: "Created by Maestro"
- tapOn:
    id: "edit-schedule-button"
- assertVisible:
    id: "schedule-modal"
- assertVisible:
    id: "rrule-frequency-daily"
- assertVisible:
    id: "rrule-frequency-weekly"
- assertVisible:
    id: "rrule-frequency-monthly"
- tapOn:
    id: "done-editing-schedule-button"
- tapOn:
    id: "create-shift-button"
- extendedWaitUntil:
    visible:
      id: "rota-detail-screen"
    timeout: 15000
- assertVisible:
    id: "rota-detail-duration-row"
- assertVisible:
    id: "rota-detail-assignment-row"
- assertVisible:
    id: "rota-members-section"
