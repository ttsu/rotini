appId: com.gorotini.app
---
- runFlow: ../generated/login-owner.yaml
- runFlow: ../generated/open-swap-occurrence.yaml
- extendedWaitUntil:
    visible:
      id: "request-swap-button"
    timeout: 10000
- tapOn:
    id: "request-swap-button"
- assertVisible:
    id: "swap-request-modal"
- assertVisible:
    id: "swap-target-e2e-member"
- assertNotVisible:
    id: "swap-target-e2e-viewer"
- tapOn:
    id: "swap-target-e2e-member"
- tapOn:
    id: "swap-message-input"
- inputText: "Can you cover this?"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "send-swap-request-button"
    direction: DOWN
- tapOn:
    id: "send-swap-request-button"
- extendedWaitUntil:
    visible:
      id: "swap-pending-banner"
    timeout: 15000
- assertVisible:
    id: "swap-pending-message"
- runFlow: ../generated/login-member.yaml
- runFlow: ../generated/open-swap-occurrence.yaml
- assertVisible:
    id: "swap-pending-banner"
- assertVisible:
    id: "swap-pending-message"
- tapOn:
    id: "accept-swap-button"
- extendedWaitUntil:
    visible:
      id: "occurrence-assignee-e2e-member"
    timeout: 15000
- runFlow: ../generated/login-owner.yaml
- runFlow: ../generated/open-override-occurrence.yaml
- extendedWaitUntil:
    visible:
      id: "override-assignment-button"
    timeout: 10000
- tapOn:
    id: "override-assignment-button"
- assertVisible:
    id: "override-assignment-modal"
- assertVisible:
    id: "override-target-e2e-member"
- assertNotVisible:
    id: "override-target-e2e-viewer"
- tapOn:
    id: "override-target-e2e-member"
- tapOn:
    id: "override-reason-input"
- inputText: "Owner override from Maestro"
- tapOn:
    id: "submit-override-button"
- extendedWaitUntil:
    visible:
      id: "override-reason-text"
    timeout: 15000
- assertVisible:
    id: "override-reason-text"
