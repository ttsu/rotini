appId: com.gorotini.app
---
- runFlow: ../generated/login-owner.yaml
- assertVisible:
    id: "home-today-section"
- assertVisible:
    id: "home-rota-card-e2e-kitchen-duty"
- assertVisible:
    id: "home-rota-status-e2e-kitchen-duty"
- takeScreenshot: /private/tmp/claude-501/-Users-tim-projects-rotini/9e7df1f9-9923-4e7b-acad-626e11fdb6eb/scratchpad/screens/02-home
- tapOn:
    text: "Settings"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 10000
- assertVisible:
    id: "settings-display-name"
- assertVisible:
    id: "settings-email"
- assertVisible:
    id: "settings-notifications-row"
- assertVisible:
    id: "settings-appearance"
- takeScreenshot: /private/tmp/claude-501/-Users-tim-projects-rotini/9e7df1f9-9923-4e7b-acad-626e11fdb6eb/scratchpad/screens/03-settings
- scrollUntilVisible:
    element:
      id: "settings-sign-out-button"
    direction: DOWN
- assertVisible:
    id: "settings-sign-out-button"
- scrollUntilVisible:
    element:
      id: "settings-edit-profile-row"
    direction: UP
- tapOn:
    id: "settings-edit-profile-row"
- extendedWaitUntil:
    visible:
      id: "edit-profile-screen"
    timeout: 10000
- assertVisible:
    id: "edit-profile-save-button"
- takeScreenshot: /private/tmp/claude-501/-Users-tim-projects-rotini/9e7df1f9-9923-4e7b-acad-626e11fdb6eb/scratchpad/screens/04-edit-profile
- tapOn:
    id: "edit-profile-display-name"
- inputText: "."
- tapOn:
    id: "edit-profile-save-button"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 15000
- tapOn:
    id: "settings-edit-profile-row"
- tapOn:
    id: "edit-profile-display-name"
- eraseText: 1
- tapOn:
    id: "edit-profile-save-button"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 15000
