appId: com.gorotini.app
---
# PART 1: Requester cancels a pending swap request
- runFlow: ../generated/login-owner.yaml
- runFlow: ../generated/open-cancel-decline-occurrence.yaml
- extendedWaitUntil:
    visible:
      id: "occurrence-assignee-e2e-owner"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "request-swap-button"
    timeout: 10000
- tapOn:
    id: "request-swap-button"
- assertVisible:
    id: "swap-request-modal"
- tapOn:
    id: "swap-target-e2e-member"
- tapOn:
    id: "swap-message-input"
- inputText: "Cancel test"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "send-swap-request-button"
    direction: DOWN
- tapOn:
    id: "send-swap-request-button"
- extendedWaitUntil:
    visible:
      id: "swap-pending-banner"
    timeout: 15000
- tapOn:
    id: "cancel-swap-button"
- tapOn:
    text: "Cancel swap"
- extendedWaitUntil:
    visible:
      id: "request-swap-button"
    timeout: 10000
- assertNotVisible:
    id: "swap-pending-banner"

# PART 2: Target declines a pending swap request
- runFlow: ../generated/login-owner.yaml
- runFlow: ../generated/open-cancel-decline-occurrence.yaml
- extendedWaitUntil:
    visible:
      id: "occurrence-assignee-e2e-owner"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "request-swap-button"
    timeout: 10000
- tapOn:
    id: "request-swap-button"
- tapOn:
    id: "swap-target-e2e-member"
- tapOn:
    id: "swap-message-input"
- inputText: "Decline test"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "send-swap-request-button"
    direction: DOWN
- tapOn:
    id: "send-swap-request-button"
- extendedWaitUntil:
    visible:
      id: "swap-pending-banner"
    timeout: 15000
- runFlow: ../generated/login-member.yaml
- runFlow: ../generated/open-cancel-decline-occurrence.yaml
- extendedWaitUntil:
    visible:
      id: "swap-pending-banner"
    timeout: 15000
- tapOn:
    id: "decline-swap-button"
- extendedWaitUntil:
    visible:
      id: "occurrence-detail-screen"
    timeout: 10000
- assertNotVisible:
    id: "swap-pending-banner"
- assertNotVisible:
    id: "decline-swap-button"
- takeScreenshot: /private/tmp/claude-501/-Users-tim-projects-rotini/9e7df1f9-9923-4e7b-acad-626e11fdb6eb/scratchpad/screens/15-swap-declined
