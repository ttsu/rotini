appId: com.gorotini.app
---
- runFlow: ../generated/login-owner.yaml
- runFlow: ../generated/open-rota.yaml
- assertVisible:
    id: 'rota-status-card'
- assertVisible:
    id: 'rota-detail-duration-row'
- assertVisible:
    id: 'rota-detail-assignment-row'
- scrollUntilVisible:
    element:
      id: 'rota-members-section'
    direction: DOWN
- assertVisible:
    id: 'rota-member-row-e2e-owner'
- assertVisible:
    id: 'rota-member-row-e2e-member'
- scrollUntilVisible:
    element:
      id: 'invite-member-button'
    direction: DOWN
- assertVisible:
    id: 'invite-member-button'
- assertVisible:
    id: 'invite-watcher-button'
- scrollUntilVisible:
    element:
      id: 'rota-watchers-section'
    direction: DOWN
- assertVisible:
    id: 'rota-watchers-heading'
- assertVisible:
    id: 'rota-member-row-e2e-viewer'
- scrollUntilVisible:
    element:
      id: 'rota-reminders-heading'
    direction: DOWN
- assertVisible:
    id: 'reminder-picker-row'
- scrollUntilVisible:
    element:
      id: 'leave-shift-button'
    direction: DOWN
- assertVisible:
    id: 'leave-shift-button'
