appId: com.timtsu.rotini
---
- launchApp
- openLink: "rotini://e2e-auth?action=logout"
- extendedWaitUntil:
    visible:
      id: "sign-in-screen"
    timeout: 15000
- assertVisible:
    id: "sign-in-title"
- assertVisible:
    id: "sign-in-email-input"
- assertVisible:
    id: "sign-in-magic-link-button"
- assertVisible:
    id: "sign-in-google-button"
