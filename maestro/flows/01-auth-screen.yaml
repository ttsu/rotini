appId: com.gorotini.app
---
- launchApp:
    clearState: true
    permissions:
      all: allow
# Wait for the app root to mount before deep-linking (a link arriving
# mid-startup races the bundle load); any signed-in/out root counts.
- extendedWaitUntil:
    optional: true
    visible:
      id: "sign-in-screen|home-today-section|onboarding-profile-screen"
    timeout: 15000
- runFlow:
    when:
      visible:
        text: "Try again"
    commands:
      - tapOn:
          text: "Try again"
- openLink: "rotini://e2e-auth?action=logout"
# iOS 26 confirms external custom-scheme opens ("Open in "Rotini"?"), and the
# open can fire more than once — accept every confirmation that stacks up.
- repeat:
    times: 6
    while:
      visible:
        text: "^Open$"
    commands:
      - tapOn:
          text: "^Open$"
      - extendedWaitUntil:
          optional: true
          notVisible:
            text: "^Open$"
          timeout: 3000
- extendedWaitUntil:
    visible:
      id: "sign-in-screen"
    timeout: 15000
- assertVisible:
    id: "sign-in-title"
- assertVisible:
    id: "sign-in-email-input"
- assertVisible:
    id: "sign-in-magic-link-button"
- assertVisible:
    id: "sign-in-google-button"
- takeScreenshot: /private/tmp/claude-501/-Users-tim-projects-rotini/9e7df1f9-9923-4e7b-acad-626e11fdb6eb/scratchpad/screens/01-sign-in
